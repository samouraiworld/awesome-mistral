# HTTP errors, rate limits, timeouts and redirect loops must fail the check.
accept = ["200..=299"]
timeout = 30
max_retries = 2
max_concurrency = 8
host_concurrency = 2
max_redirects = 10
include_fragments = "anchor-only"
exclude_all_private = true
cache = false
# Exact anti-bot exceptions: evidence and expiry (at most 14 days) in maintenance.json.
# X ownership is corroborated upstream; Reddit returned 200 locally and 403 in CI.
exclude = [
    '^https://x\.com/MistralAI$',
    '^https://www\.reddit\.com/r/LocalLLaMA/$',
    '^https://www\.reddit\.com/r/MistralAI/$',
]
